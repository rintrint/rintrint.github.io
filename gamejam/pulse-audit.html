*{box-sizing:border-box}body{margin:0;background:#e5f4f8;color:#244b65;font:17px/1.65 system-ui,'Noto Sans TC',sans-serif}main{max-width:1100px;margin:auto;padding:35px 24px}h1{font-size:36px;line-height:1.3}a{color:#246784}header{display:flex;justify-content:space-between;align-items:center}.panel{padding:24px;background:#faffff;border:1px solid #bcdde7;border-radius:22px;margin:20px 0}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{font:inherit;border:1px solid #90b9cb;border-radius:12px;background:#ecf7fa;color:#245775;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #358eae;outline-offset:3px}#play{background:#286a85;color:white;min-width:130px}input[type=range]{width:100%;accent-color:#278da4}canvas{width:100%;height:300px;border-radius:16px;background:#183f58;display:block;margin:20px 0}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}.legend b{color:#217983}.legend em{color:#538698;font-style:normal}#clock{font:700 24px monospace}#summary{font-size:18px}.note{color:#54798a;font-size:15px}output{font-weight:700}.row{display:flex;justify-content:space-between;gap:15px}#error{color:#ae4252}.report{font-size:15px}small{font-size:14px}@media(max-width:600px){main{padding:20px 14px}h1{font-size:29px}.panel{padding:18px}canvas{height:240px}.controls{gap:8px}button,select{font-size:15px;padding:9px 12px}header{font-size:14px}}
</style></head><body><main><header><a href="pulse.html">← 回第九版</a><span>09 / TIMING LAB</span></header><h1>讓鼓點自己說話。</h1><p>切換原曲與譜面輕響，比較前、中、後段。三個難度使用相同的拍點時間，中低難度只規律跳拍。</p><div class="panel"><div class="controls"><button id="play" disabled>載入中…</button><label>譜面 <select id="level"><option value="expert">高手 · 433 拍</option><option value="intermediate">中階 · 208 拍</option><option value="beginner">新手 · 109 拍</option><option value="grid">連續拍格</option></select></label><label><input type="checkbox" id="clicks" checked> 加入譜面輕響</label><button id="export">匯出時間點 TXT</button></div><canvas id="plot" aria-label="音樂起音與譜面拍點對照圖"></canvas><div class="legend"><b>金色長線＝譜面按鍵</b><em>青色曲線＝原曲頻谱起音</em><span>白色短線＝獨立高頻瞬態</span></div><div class="row"><span id="clock">0:00.000</span><label>顯示 <select id="zoom"><option value="2">2 秒</option><option value="4" selected>4 秒</option><option value="8">8 秒</option></select></label></div><input id="seek" type="range" min="0" max="194.73" step=".01" value="0" aria-label="歌曲時間"><div class="controls"><button data-seek="8">前段 0:08</button><button data-seek="65">中段 1:05</button><button data-seek="125">後段 2:05</button><button data-seek="165">尾段 2:45</button></div><p id="error" role="alert"></p></div><div class="panel"><h2>這次如何對拍</h2><p id="summary"></p><p class="report" id="report"></p><p class="note">驗證數字是拍格與聲音瞬態的差距，不代表已通過專業玩家實測。音效卡與耳機的剩餘延遲可回遊戲「難度與校正」調整。圖上保留獨立量測資料，沒有把譜面時間重新當作檢測答案。</p><a href="assets/pulse/timing-report.json">完整分析紀錄</a></div></main><script type="module" src="pulse-audit.js"></script></body></html>

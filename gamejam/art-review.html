<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breath — 美術對照</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b44;color:#e0eef2;font:13px sans-serif}header{padding:20px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font:26px Georgia;margin:0}h1 small{font:11px sans-serif;margin-left:14px;opacity:.7}nav{display:flex;gap:7px;flex-wrap:wrap}button,a{color:inherit;background:#1c4260;border:1px solid #52728655;border-radius:5px;padding:9px 12px;text-decoration:none;cursor:pointer;font:11px sans-serif}button[aria-pressed=true]{background:#d3e6e2;color:#214c65}.views{display:grid;grid-template-columns:1fr 1fr;gap:2px}.view{height:calc(100vh - 100px);position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}.label{position:absolute;top:18px;left:20px;color:#335c70;font-size:10px;letter-spacing:2px;background:#eff8f0ba;padding:9px 12px;border-radius:20px}.notice{padding:0 25px 12px;font-size:10px;opacity:.6}@media(max-width:700px){.views{grid-template-columns:1fr}.view{height:auto;aspect-ratio:4/3}}
.review-danger{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 48%,transparent 8%,#24112920 30%,#25091ed9 100%)}.label{z-index:2}.review-state{position:absolute;bottom:14px;left:20px;color:#eff4e9;font-size:11px;text-shadow:0 2px 6px #000;z-index:2}</style></head><body><header><h1>Breath<small>同一段旅程 · 美術檢視</small></h1><nav><button data-scene="opening">冰上開場</button><button data-scene="swim" aria-pressed="true">冰海悠游</button><button data-scene="hole">釣魚人的冰洞</button><button data-scene="leap">大吸氣跳躍</button><button data-scene="ending">朋友相聚</button><button data-scene="small">小海豹</button><button data-scene="grown">飽飽海豹</button><button data-scene="danger">缺氧危險</button><button data-scene="ghost">餓死鬼</button><button data-scene="angel">天使</button><a href="index.html">試玩 2D ↗</a><a href="3d.html">試玩 3D ↗</a></nav></header><div class="notice">此頁只檢視美術場景，不計入遊戲進度。兩版使用同一組角色位置、故事狀態與節奏。</div><div class="views"><div class="view"><canvas id="two"></canvas><div class="review-danger"></div><div class="review-state"></div><div class="label">2D · 手繪冰海</div></div><div class="view"><canvas id="three"></canvas><div class="review-danger"></div><div class="review-state"></div><div class="label">3D · 光影冰海</div></div></div><script src="journey-core.js"></script><script type="module">
import {Ice2D} from './journey-view2d.js';import {Ice3D} from './journey-view3d.js';
const {Journey,SURFACE,HOLES}=BreathJourney,g=new Journey(),a=new Ice2D(document.querySelector('#two')),b=new Ice3D(document.querySelector('#three')),fx={particles:[],rings:[],word:null};
let scene='swim',sceneStarted=0;function setup(name){scene=name;sceneStarted=performance.now()/1000;g.reset();g.food=6;g.oxygen=74;g.status='paused';g.stage='swim';g.x=1080;g.y=535;
if(name==='small')g.food=0;
if(name==='grown'){g.food=12;g.evolutionGlow=1;}
if(name==='danger')g.oxygen=8;
if(name==='ghost'||name==='angel'){g.stage='dying';g.food=name==='angel'?12:3;g.oxygen=0;g.outcome=name==='angel'?'angel':'hungryGhost';}
if(name==='opening'){g.stage='breathe';g.x=420;g.y=SURFACE-33;g.food=0;g.oxygen=20;}
if(name==='hole'){g.x=HOLES[1]-30;g.y=SURFACE+105;g.holding=true;}
if(name==='leap'){g.x=2480;g.y=45;g.checkpoint=2;g.food=12;g.transition={type:'greatLeap',t:1,duration:2.15};g.fisherKnocks={1:0,2:0};}
if(name==='ending'){g.x=HOLES[4];g.y=SURFACE-33;g.food=16;g.stage='ending';g.endingTime=7;}
document.querySelectorAll('[data-scene]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.scene===name)));}
function resize(){for(const [renderer,id]of[[a,'two'],[b,'three']]){const rect=document.getElementById(id).getBoundingClientRect();renderer.resize(rect.width,rect.height,devicePixelRatio);}}
await Promise.all([a.ready,b.ready]);setup('swim');resize();addEventListener('resize',resize);document.querySelectorAll('[data-scene]').forEach(el=>el.addEventListener('click',()=>setup(el.dataset.scene)));
function frame(t){g.time=t/1000;const elapsed=t/1000-sceneStarted;g.deathTime=Math.min(3.6,elapsed);g.evolutionGlow=scene==='grown'?Math.max(0,1-elapsed*.45):0;document.querySelectorAll('.review-danger').forEach(el=>el.style.opacity=g.danger*(.55+g.heartbeat*.22));document.querySelectorAll('.review-state').forEach(el=>el.textContent=`${g.formName} · 飽食 ${g.food}/12 · 氧氣 ${g.oxygen}%${g.outcome?' · '+(g.outcome==='angel'?'天使':'餓死鬼'):''}`);g.holdStart=g.time-1.8;a.render(g,t/1000,fx);b.render(g,t/1000,fx);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
